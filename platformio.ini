; PlatformIO project configuration
; Project : Occupancy-Based Lighting/HVAC
; Phase   : 2B - Local ESP32 firmware compilation and validation
; Board   : ESP32 DevKit C V4 (matches wokwi/diagram.json part "board-esp32-devkit-c-v4")

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = time, colorize

; OneWire + DallasTemperature are declared here so the build does not rely on
; globally installed libraries. These are the same two libraries the Wokwi
; sketch.ino relies on, so firmware behaviour is identical in both places.
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

build_flags =
    -Wall

; src/ is shared with the Python analysis code added in Phase 2C
; (config.py, data_generator.py). Restrict the firmware build to main.cpp so
; no Python file, and no stray source dropped in later, is ever handed to the
; ESP32 compiler.
build_src_filter = +<main.cpp>
